networks:
  backend:

services:
  backend:
    build:
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    networks:
      - backend
    env_file:
      - .env

  searxng:
    image: searxng/searxng:latest
    networks:
      - backend
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped

  web-search-mcp:
    build:
      context: ./web-search-mcp
      dockerfile: ../docker/web-search-mcp.Dockerfile
    networks:
      - backend
    environment:
      - PORT=8000
      - SEARXNG_URL=http://searxng:8080
      - LOG_LEVEL=INFO
    shm_size: '2gb'
    depends_on:
      - searxng
    restart: unless-stopped
